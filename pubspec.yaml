name: chm_web
description: "BENS Digital Solutions - site vitrine et back-office."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.5
  # Navigation
  go_router: ^14.0.0
  cached_network_image: ^3.3.0
  visibility_detector: ^0.4.0+2
  video_player: ^2.9.2
  # State Management
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  http: ^1.1.0
  easy_localization: ^3.0.0
  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  file_picker: ^6.1.1
  # UI Components
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  image: ^4.3.0

  # Utilities
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/icons/
    - assets/fonts/
    - assets/traduction/

  fonts:
    - family: Inter
      fonts:
        - asset: "assets/fonts/Inter-VariableFont_opsz,wght.ttf"
        - asset: "assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf"
          style: italic